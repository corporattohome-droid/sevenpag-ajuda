<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Ajuda</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#19b955;--green-d:#128a3f;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--wa:#25d366}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#f6f8f6;color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--border);padding:18px 20px}
.tag{color:var(--green-d);font-weight:700;font-size:18px}
.hero{background:var(--green);color:#fff;padding:44px 20px 52px;text-align:center;border-bottom-right-radius:44px}
.hero h1{font-size:34px;font-weight:800}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.cta{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center}
.cta h2{font-size:21px;font-weight:700;margin-bottom:6px}
.cta p{color:var(--muted);margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--wa);color:#fff;text-decoration:none;padding:16px 30px;border-radius:12px;font-weight:700;font-size:17px}
.btn svg{fill:#fff}
.sec{font-size:22px;font-weight:800;margin:36px 0 6px;padding-left:4px}
.menu{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.menu a{display:flex;align-items:center;gap:14px;padding:20px;text-decoration:none;color:var(--text);border-bottom:1px solid var(--border)}
.menu a:last-child{border-bottom:0}
.menu .ic{width:42px;height:42px;border-radius:10px;background:#e7f8ee;color:var(--green-d);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.menu .label{flex:1;font-weight:600;font-size:17px}
.menu .arrow{color:var(--muted)}
</style>
</head>
<body>
<header><span class="tag">Central de Ajuda</span></header>
<section class="hero"><h1>Central de Ajuda</h1></section>
<main>
  <div class="cta">
    <h2>Solicite suporte pelo WhatsApp</h2>
    <p>Precisa de ajuda? Fale com a gente.</p>
    <a class="btn" href="https://wa.me/5511921145207?text=Ol%C3%A1!%20Preciso%20de%20suporte.">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.8-1.1-4.6-4-4.8-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.3 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
      Falar no WhatsApp
    </a>
  </div>

  <h2 class="sec">Categorias</h2>
  <nav class="menu">
    <a href="#"><span class="ic">▣</span><span class="label">Maquininha</span><span class="arrow">›</span></a>
    <a href="#"><span class="ic">$</span><span class="label">Conta</span><span class="arrow">›</span></a>
    <a href="#"><span class="ic">↔</span><span class="label">Pagamentos</span><span class="arrow">›</span></a>
  </nav>
</main>
</body>
</html>
